name: Atualizar data.json do painel

on:
  schedule:
    # 10:00 UTC = 07:00 no horário de Brasília (sem horário de verão desde 2019)
    - cron: "0 10 * * *"
  workflow_dispatch: {}  # permite rodar manualmente pelo botão "Run workflow" no GitHub

# Impede que dois runs (ex.: o agendado das 10:00 UTC + um manual disparado perto do mesmo
# horário) rodem em paralelo e briguem pelo git push. Com isso, se um segundo run for
# disparado enquanto o primeiro ainda está rodando, ele fica na fila e só começa depois
# que o primeiro terminar -- resolve a causa raiz do "rejected (fetch first)".
concurrency:
  group: atualizar-data-json
  cancel-in-progress: false

permissions:
  contents: write  # necessário para o Action poder commitar o data.json de volta no repo

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r scripts/requirements.txt

      - name: Rodar extração
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          python scripts/extract_data.py --config scripts/config.json --out data.json

      - name: Commitar data.json se algo mudou
        run: |
          git config user.name "cataratas-dashboard-bot"
          git config user.email "actions@github.com"
          cp data.json /tmp/data.json.novo

          # Tenta algumas vezes: se dois runs (agendado + manual, por exemplo) rodarem perto
          # um do outro, o push pode ser rejeitado porque o remoto avançou entre o checkout
          # e o push deste job. Em vez de falhar, busca o main mais novo e reaplica o
          # data.json recém-gerado por cima antes de tentar de novo.
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/data.json.novo data.json
            git add data.json
            if git diff --cached --quiet; then
              echo "Nada mudou nos dados hoje."
              break
            fi
            git commit -m "chore: atualizar data.json ($(date -u +%Y-%m-%dT%H:%MZ))"
            if git push; then
              echo "Push ok."
              break
            fi
            echo "Push rejeitado (corrida com outro run) -- tentativa $i, tentando de novo..."
            sleep 5
          done
